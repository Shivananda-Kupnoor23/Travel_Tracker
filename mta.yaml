_schema-version: "3.1"
ID: travel-tracker
version: 1.0.0
description: Travel Tracker - Employee Travel Intelligence System

parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm --prefix react-ui install
        - npm --prefix react-ui run build
        - mkdir -p app/react-dist
        - cp -r react-ui/dist/. app/react-dist/

modules:
  - name: travel-tracker-srv
    type: nodejs
    path: .
    parameters:
      buildpack: nodejs_buildpack
      memory: 256M
    build-parameters:
      builder: npm
      ignore:
        - react-ui/node_modules/
        - react-ui/dist/
        - mta_archives/
        - .git/
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
